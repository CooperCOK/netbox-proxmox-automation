- name: "Proxmox: Clone VM and set VM resources"
  connection: local
  hosts: all
  gather_facts: False

  vars:
    collected_proxmox_vm: {}
    collected_proxmox_lxc: {}
    proxmox_node_info: {}
    collected_proxmox_vms: []

    # Name, unter dem das Netzwerkinterface in NetBox angelegt wird. Er soll
    # dem entsprechen, was der Gast selbst anzeigt - sonst laesst sich in
    # NetBox nicht nachvollziehen, welches Interface gemeint ist.
    # Windows benennt die erste Karte "Ethernet", Debian/Ubuntu vergeben auf
    # Proxmox-VMs mit virtio ueblicherweise "ens18".
    windows_interface_name: "Ethernet"
    default_interface_name: "ens18"

  tasks:
  - name: Include Proxmox VM discovery
    include_tasks: "ansible-tasks/collect-proxmox-vm.yml"

  - name: Include Proxmox LXC discovery
    include_tasks: "ansible-tasks/collect-proxmox-lxc.yml"

  - name: SHOW US vmconfig
    debug:
      msg: "vm_config {{ vm_config }}"

  - name: Show us NetBox config
    debug:
      msg: "NetBox config {{ netbox_env_info }}"

  - name: Show us Proxmox config
    debug:
      msg: "Proxmox config {{ proxmox_env_info }}"

  - name: Show us id of template (integer)
    debug:
      msg: "ID of template (integer) {{ vm_config['template'] | int }}"

  - name: Create VM from a full clone of template
    community.proxmox.proxmox_kvm:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      node: "{{ proxmox_env_info.node }}"
      target: "{{ vm_config['node']}}"
      api_user: "{{ proxmox_env_info.api_user }}"
      api_token_id: "{{ proxmox_env_info.api_token_id }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret }}"
      api_host: "{{ proxmox_env_info.api_host }}"
      # api_port kommt aus unserer AWX-Credential nicht - Modul-Standard (8006) nutzen
      api_port: "{{ proxmox_env_info.api_port | default(omit) }}"
      clone: "{{ vm_config['template'] }}"
      vmid: "{{ vm_config['template'] }}"
      name: "{{ vm_config['name'] }}"
      newid: "{{ vm_config['vmid'] | int | default(omit) }}"
      agent: 'enabled=1'
      storage: "{{ vm_config['storage'] }}"
      #onboot: "{{ vm_config_create[item].auto_start }}"
      state: present
      timeout: 120
    when: not vm_config['name'] in collected_proxmox_vm and not vm_config['name'] in collected_proxmox_lxc
    register: clone_vm_job
    async: 180
    poll: 0

  - name: Wait for VM cloning processes to finish
    async_status:
      jid: "{{ clone_vm_job.ansible_job_id }}"
    register: _jobs_alias_vc_0
    until: _jobs_alias_vc_0.finished
    retries: 60
    delay: 5
    when: not vm_config['name'] in collected_proxmox_vm

  - name: Update Proxmox VMs resource settings
    community.proxmox.proxmox_kvm:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      node: "{{ vm_config['node'] }}"
      api_user: "{{ proxmox_env_info.api_user }}"
      api_token_id: "{{ proxmox_env_info.api_token_id }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret }}"
      #api_host: "{{ proxmox_env_info.api_host }}"
      api_host: "{{ vm_config['node'] }}"
      name: "{{ vm_config['name'] }}"
      cores: "{{ vm_config['vcpus'] | int }}"
      vcpus: "{{ vm_config['vcpus'] | int }}"
      memory: "{{ vm_config['memory'] }}"
      update: true
    register: update_vms_settings_job
    async: 180
    poll: 0

  - name: Wait for VM settings updates processes to finish
    async_status:
      jid: "{{ update_vms_settings_job.ansible_job_id }}"
    register: _ujobs_alias_vc_0
    until: _ujobs_alias_vc_0.finished
    retries: 60
    delay: 10

  # ---------------------------------------------------------------------------
  # Erst-Passwort fuer cloud-init setzen.
  #
  # Proxmox' Clone-Aufruf nimmt cipassword nicht entgegen - es muss per Update
  # nachgezogen werden. Deshalb hier als eigener Schritt nach dem Klonen.
  #
  # no_log verhindert, dass das Passwort im AWX-Job-Log erscheint.
  # ---------------------------------------------------------------------------
  - name: Set the initial cloud-init admin password
    community.proxmox.proxmox_kvm:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      node: "{{ vm_config['node'] }}"
      api_user: "{{ proxmox_env_info.api_user }}"
      api_token_id: "{{ proxmox_env_info.api_token_id }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret }}"
      api_host: "{{ vm_config['node'] }}"
      name: "{{ vm_config['name'] }}"
      cipassword: "{{ vm_config['initial_admin_password'] }}"
      update: true
    no_log: true
    when: (vm_config['initial_admin_password'] | default('')) | length > 0

  - name: "Discover information for newly-created Proxmox VM"
    community.proxmox.proxmox_vm_info:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      #api_host: "{{ proxmox_env_info.api_host | default(omit) }}"
      api_host: "{{ vm_config['node'] }}"
      api_user: "{{ proxmox_env_info.api_user | default(omit) }}"
      api_token_id: "{{ proxmox_env_info.api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret | default(omit) }}"
      node: "{{ vm_config['node'] }}"
      name: "{{ vm_config['name'] }}"
    register: new_proxmox_vm

  - name: Show us new VM info
    debug:
      msg: "New VM info: {{ new_proxmox_vm }}"

  - name: "Update Proxmox vmid for VM in NetBox"
    netbox.netbox.netbox_virtual_machine:
      netbox_url: "{{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port}}"
      netbox_token: "{{ netbox_env_info.api_token }}"
      data:
        name: "{{ new_proxmox_vm.proxmox_vms[0].name }}"
        custom_fields:
          proxmox_vmid: "{{ new_proxmox_vm.proxmox_vms[0].vmid | string }}"
      state: present
    when: new_proxmox_vm is defined and new_proxmox_vm.proxmox_vms is defined and new_proxmox_vm.proxmox_vms | length > 0 and vm_config['vmid'] is defined and vm_config['vmid'] == "None"

# ok: [localhost] => {
#    "msg": "New VM info: {'changed': False, 'proxmox_vms': [{'maxcpu': 1, 'status': 'stopped', 'netout': 0, 'vmid': 104, 'diskwrite': 0, 'id': 'qemu/104', 'uptime': 0, 'node': 'proxmox-ve', 'disk': 0, 'maxdisk': 2361393152, 'type': 'qemu', 'maxmem': 268435456, 'template': False, 'mem': 0, 'diskread': 0, 'netin': 0, 'cpu': 0, 'name': 'test2', 'cpus': 1, 'serial': 1}], 'failed': False}"
#}
#  - name: Show human-readable disk size from newly-created VM
#    debug:
#      msg: "human readable disk size: {{ new_proxmox_vm.proxmox_vms[0].maxdisk | human_readable(unit='M') }} ||| {{ new_proxmox_vm.proxmox_vms[0].maxdisk | human_readable(unit='M') | regex_replace('\\s+[M][Bb]$', '') | int | string }} ||| {{ new_proxmox_vm.proxmox_vms[0].maxdisk | human_readable(unit='M') | regex_replace('\\s+[M][Bb]$', '') | int | string | type_debug }}"

  # ---------------------------------------------------------------------------
  # Die in NetBox gewuenschte Disk-Groesse einloesen.
  #
  # Der Clone-Job bekommt vom Webhook nur node, name, vmid, vcpus, memory,
  # template und storage - die Disk-Groesse ist NICHT dabei. Die geklonte VM
  # erbt damit zwangslaeufig die Disk des Templates.
  #
  # Ohne diesen Block schrieb der folgende Task die geerbte Groesse nach NetBox
  # zurueck und ueberschrieb damit die Vorgabe des Anwenders. Beobachtet am
  # 31.07.2026: VM mit 100000 MB angelegt, Template hat 80 GB -> NetBox stand
  # danach auf 81920 MB. Dieser Rueckschreibvorgang loeste ausserdem die Event
  # Rule fuer Resize aus, die dann 80G auf eine 80G-Disk anwendete - ein
  # Kreislauf, der die Vorgabe verwarf und wie ein erfolgreicher Lauf aussah.
  #
  # Deshalb: Sollgroesse aus NetBox nachschlagen und die Disk VOR dem
  # Rueckschreiben darauf vergroessern. Danach stimmen Soll und Ist ueberein
  # und es feuert kein sinnloses Resize-Event mehr.
  # ---------------------------------------------------------------------------
  # Die Vorgabe steht im Feld "disk" der VIRTUAL MACHINE, nicht in einem
  # VirtualDisk-Objekt: Beim Anlegen einer VM in NetBox wird dort die
  # gewuenschte Groesse in MB eingetragen. Ein VirtualDisk gibt es zu diesem
  # Zeitpunkt noch nicht - das legt erst der Task "Update Proxmox storage for
  # VM in NetBox" weiter unten an. Sobald es existiert, berechnet NetBox
  # VirtualMachine.disk aus der Summe der VirtualDisks; ein erneuter Lauf liest
  # hier also den Ist-Wert und vergroessert nichts mehr. Das ist gewollt.
  #
  # Am 31.07.2026 im NetBox-Aenderungsprotokoll belegt:
  #   19:01:13 create testclone111 user=rz4adm.gt disk: None  -> 102390
  #   19:01:52 update testclone111 user=Ansible   disk: 81920 -> 81920
  - name: "Look up the disk size requested in NetBox"
    ansible.builtin.uri:
      url: >-
        {{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port }}/api/virtualization/virtual-machines/?name={{ new_proxmox_vm.proxmox_vms[0].name | urlencode }}
      headers:
        Authorization: "Token {{ netbox_env_info.api_token }}"
        Accept: "application/json"
      validate_certs: false
    register: nb_requested_disk
    when: new_proxmox_vm is defined and new_proxmox_vm.proxmox_vms is defined and new_proxmox_vm.proxmox_vms | length > 0

  - name: "Determine requested and cloned disk size"
    ansible.builtin.set_fact:
      # NetBox fuehrt die Groesse in MB, Proxmox meldet maxdisk in Bytes.
      requested_disk_mb: "{{ (nb_requested_disk.json.results[0].disk | default(0) | default(0, true)) | int }}"
      cloned_disk_mb: "{{ (new_proxmox_vm.proxmox_vms[0].maxdisk | int / 1048576) | round | int }}"
    when: nb_requested_disk is defined and nb_requested_disk.json is defined

  - name: "Fail if the requested disk is smaller than the template's"
    ansible.builtin.fail:
      msg: >-
        In NetBox sind fuer die VM {{ requested_disk_mb }} MB Disk hinterlegt,
        das Template liefert aber {{ cloned_disk_mb }} MB. Verkleinern ist bei
        Proxmox/Ceph RBD nicht moeglich. Die VM
        '{{ vm_config['name'] }}' wurde bereits angelegt und behaelt die
        Template-Groesse - bitte den Wert in NetBox auf mindestens
        {{ cloned_disk_mb }} MB korrigieren oder ein passendes Template waehlen.
    when:
      - requested_disk_mb is defined
      - requested_disk_mb | int > 0
      - requested_disk_mb | int < cloned_disk_mb | int

  - name: "Grow the cloned disk to the size requested in NetBox"
    community.proxmox.proxmox_disk:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      api_user: "{{ proxmox_env_info.api_user }}"
      api_token_id: "{{ proxmox_env_info.api_token_id }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret }}"
      api_host: "{{ vm_config['node'] }}"
      name: "{{ vm_config['name'] }}"
      disk: scsi0
      # Bewusst in MB statt in GB: die NetBox-Vorgabe ist nicht zwingend ein
      # glattes Vielfaches von 1024 (z.B. 100000 MB). Ein Umrechnen auf ganze
      # GB wuerde runden und Soll und Ist dauerhaft auseinanderlaufen lassen.
      size: "{{ requested_disk_mb | int }}M"
      state: resized
    register: clone_disk_grown
    when:
      - requested_disk_mb is defined
      - requested_disk_mb | int > cloned_disk_mb | int

  # Nach dem Vergroessern den Ist-Stand neu einlesen: Proxmox rundet die
  # RBD-Groesse gegebenenfalls auf, und nach NetBox gehoert der tatsaechliche
  # Wert - nicht der angeforderte.
  - name: "Re-read VM info after growing the disk"
    community.proxmox.proxmox_vm_info:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      api_host: "{{ vm_config['node'] }}"
      api_user: "{{ proxmox_env_info.api_user | default(omit) }}"
      api_token_id: "{{ proxmox_env_info.api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret | default(omit) }}"
      node: "{{ vm_config['node'] }}"
      name: "{{ vm_config['name'] }}"
    register: proxmox_vm_after_grow
    when: clone_disk_grown is defined and clone_disk_grown is changed

  - name: "Determine the effective disk size for NetBox"
    ansible.builtin.set_fact:
      effective_disk_mb: >-
        {{ ((proxmox_vm_after_grow.proxmox_vms[0].maxdisk
             if (proxmox_vm_after_grow.proxmox_vms is defined and proxmox_vm_after_grow.proxmox_vms | length > 0)
             else new_proxmox_vm.proxmox_vms[0].maxdisk) | int / 1048576) | round | int }}
    when: new_proxmox_vm is defined and new_proxmox_vm.proxmox_vms is defined and new_proxmox_vm.proxmox_vms | length > 0

  - name: "Update Proxmox storage for VM in NetBox"
    netbox.netbox.netbox_virtual_disk:
      netbox_url: "{{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port}}"
      netbox_token: "{{ netbox_env_info.api_token }}"
      data:
        virtual_machine: "{{ new_proxmox_vm.proxmox_vms[0].name }}"
        name: scsi0
        size: "{{ effective_disk_mb | int | string }}"
        custom_fields:
          proxmox_disk_storage_volume: "{{ vm_config['storage'] }}"
      state: present
    when: new_proxmox_vm is defined and new_proxmox_vm.proxmox_vms is defined and new_proxmox_vm.proxmox_vms | length > 0

  # ---------------------------------------------------------------------------
  # Netzwerkinterface in NetBox anlegen.
  #
  # Das Template bringt eine Netzwerkkarte ohne inhaltliche Konfiguration mit
  # (kein ipconfig0, im Gast auf DHCP). Damit in NetBox ueberhaupt ein Objekt
  # existiert, an das sich VLAN und IP haengen lassen, legt dieser Job das
  # Interface an - bewusst NUR anlegen, ohne VLAN und ohne IP. Die eigentliche
  # Konfiguration kommt danach aus awx-proxmox-set-ipconfig0.yml, das aus dem
  # dort gesetzten VLAN das passende Proxmox-VNet ermittelt.
  #
  # Der Name soll dem entsprechen, was der Gast selbst anzeigt - sonst laesst
  # sich in NetBox nicht zuordnen, welches Interface gemeint ist. Ob Windows
  # vorliegt, verraet der Name des Templates: vm_config['template'] enthaelt
  # dessen VMID (z.B. "9000"), der Name wird dazu aus Proxmox gelesen.
  # ---------------------------------------------------------------------------
  - name: "Look up the template name to detect the guest OS"
    community.proxmox.proxmox_vm_info:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      api_host: "{{ vm_config['node'] }}"
      api_user: "{{ proxmox_env_info.api_user | default(omit) }}"
      api_token_id: "{{ proxmox_env_info.api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret | default(omit) }}"
      node: "{{ vm_config['node'] }}"
      vmid: "{{ vm_config['template'] | int }}"
    register: clone_template_info
    # Scheitert der Lookup, soll das nicht den gesamten Klon-Job kippen - die
    # VM ist zu diesem Zeitpunkt bereits angelegt. Das Interface wird dann
    # schlicht nicht erzeugt und laesst sich von Hand nachtragen.
    failed_when: false
    when: new_proxmox_vm is defined and new_proxmox_vm.proxmox_vms is defined and new_proxmox_vm.proxmox_vms | length > 0

  - name: "Determine the interface name from the template's OS"
    ansible.builtin.set_fact:
      guest_interface_name: >-
        {{ windows_interface_name
           if ((clone_template_info.proxmox_vms | default([]) | map(attribute='name') | join(' ') | lower) is search('windows'))
           else default_interface_name }}
    when:
      - clone_template_info is defined
      - clone_template_info.proxmox_vms is defined
      - clone_template_info.proxmox_vms | length > 0

  - name: "Show which interface will be created"
    ansible.builtin.debug:
      msg: >-
        Template {{ vm_config['template'] }} =
        '{{ clone_template_info.proxmox_vms | default([]) | map(attribute='name') | join(', ') }}'
        -> Interface '{{ guest_interface_name }}' in NetBox
    when: guest_interface_name is defined

  - name: "Create the VM network interface in NetBox"
    netbox.netbox.netbox_vm_interface:
      netbox_url: "{{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port }}"
      netbox_token: "{{ netbox_env_info.api_token }}"
      data:
        virtual_machine: "{{ new_proxmox_vm.proxmox_vms[0].name }}"
        name: "{{ guest_interface_name }}"
        enabled: true
      state: present
    when:
      - guest_interface_name is defined
      - guest_interface_name | length > 0

  # ---------------------------------------------------------------------------
  # Erst-Passwort in NetBox wieder leeren.
  #
  # ACHTUNG: Das entfernt den Wert nur aus dem aktuellen Objekt. NetBox
  # protokolliert Custom Fields im Changelog (prechange_data/postchange_data) -
  # dort bleibt das Passwort lesbar, bis das Protokoll bereinigt wird. Das
  # Leeren ist also Hygiene, kein Schutz.
  #
  # Bewusst per uri/PATCH statt ueber netbox_virtual_machine: PATCH aktualisiert
  # in NetBox nur die uebergebenen Custom Fields. Die Kontrolle danach sichert
  # ab, dass proxmox_node dabei erhalten bleibt - ginge es verloren, wuerden
  # alle spaeteren Disk-Operationen an dieser VM scheitern.
  # ---------------------------------------------------------------------------
  - name: Look up the VM in NetBox
    ansible.builtin.uri:
      url: >-
        {{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port }}/api/virtualization/virtual-machines/?name={{ vm_config['name'] | urlencode }}
      headers:
        Authorization: "Token {{ netbox_env_info.api_token }}"
        Accept: "application/json"
      validate_certs: false
    register: nb_vm_for_pw
    when: (vm_config['initial_admin_password'] | default('')) | length > 0

  - name: Clear the initial admin password in NetBox
    ansible.builtin.uri:
      url: >-
        {{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port }}/api/virtualization/virtual-machines/{{ nb_vm_for_pw.json.results[0].id }}/
      method: PATCH
      body_format: json
      body:
        custom_fields:
          proxmox_initial_admin_password: ""
      headers:
        Authorization: "Token {{ netbox_env_info.api_token }}"
        Accept: "application/json"
      status_code: 200
      validate_certs: false
    register: nb_pw_cleared
    when:
      - (vm_config['initial_admin_password'] | default('')) | length > 0
      - nb_vm_for_pw.json.count | int > 0

  - name: Verify that clearing the password did not wipe other custom fields
    ansible.builtin.fail:
      msg: >-
        Beim Leeren von proxmox_initial_admin_password ist proxmox_node
        verlorengegangen. NetBox hat die Custom Fields offenbar ersetzt statt
        zusammengefuehrt. Ohne proxmox_node scheitern alle spaeteren
        Disk-Operationen an dieser VM - bitte den Wert wiederherstellen.
    when:
      - nb_pw_cleared is defined
      - nb_pw_cleared.json is defined
      - (nb_pw_cleared.json.custom_fields.proxmox_node | default('')) | length == 0

  # ---------------------------------------------------------------------------
  # Zustand in NetBox fortschreiben - Custom Field proxmox_status.
  #
  # Gleiches Muster wie MaaS_Status bei den Devices: Das Feld bildet ab, wo die
  # VM im Ablauf steht, und dient zugleich als Ausloeser fuer den naechsten
  # Schritt. Reihenfolge:
  #
  #   (leer)                              -> VM in NetBox angelegt
  #   "Clone created"                     <- dieser Job, nach erfolgreichem Klon
  #   "configure network"                 <- von Hand gesetzt, loest die
  #                                          Netzwerkkonfiguration aus
  #   "Clone created - network configured" <- awx-proxmox-set-ipconfig0.yml
  #
  # Bewusst als letzter Schritt: Steht der Wert, ist alles davor durchgelaufen.
  #
  # Kein Kreislauf: Die Event Rule fuer die Netzwerkkonfiguration prueft auf
  # "configure network"; dieser Schreibvorgang setzt einen anderen Wert und
  # loest sie deshalb nicht aus.
  #
  # Der VM-Datensatz wurde weiter oben bereits fuer die Disk-Groesse gelesen
  # (nb_requested_disk) - die id von dort wird hier wiederverwendet.
  # ---------------------------------------------------------------------------
  - name: "Mark the clone as created in NetBox"
    ansible.builtin.uri:
      url: >-
        {{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port }}/api/virtualization/virtual-machines/{{ (nb_requested_disk.json.results | first).id }}/
      method: PATCH
      body_format: json
      body:
        custom_fields:
          proxmox_status: "Clone created"
      headers:
        Authorization: "Token {{ netbox_env_info.api_token }}"
        Accept: "application/json"
      status_code: 200
      validate_certs: false
    when:
      - nb_requested_disk is defined
      - nb_requested_disk.json is defined
      - (nb_requested_disk.json.count | default(0) | int) > 0
