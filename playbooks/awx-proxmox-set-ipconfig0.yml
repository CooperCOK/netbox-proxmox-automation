- name: "Proxmox: set ipconfig0"
  connection: local
  hosts: all
  gather_facts: False

  vars:
    collected_proxmox_vm: {}
    collected_proxmox_lxc: {}
    proxmox_node_info: {}
    collected_proxmox_vms: []

    # Fuer SDN- und Config-Abfragen gibt es kein passendes Modul, die laufen
    # deshalb direkt gegen die Proxmox-API. Die Tasks, die diesen Header
    # verwenden, sind mit no_log versehen - sonst stuende das Token im AWX-Log.
    pve_api_base: "https://{{ proxmox_env_info.api_host }}:{{ proxmox_env_info.api_port | default(8006) }}/api2/json"
    pve_auth_headers:
      Authorization: "PVEAPIToken={{ proxmox_env_info.api_user }}!{{ proxmox_env_info.api_token_id }}={{ proxmox_env_info.api_token_secret }}"
    nb_api_base: "{{ netbox_env_info.api_proto }}://{{ netbox_env_info.api_host }}:{{ netbox_env_info.api_port }}"
    nb_auth_headers:
      Authorization: "Token {{ netbox_env_info.api_token }}"
      Accept: "application/json"

  tasks:
  - name: Include Proxmox VM discovery
    include_tasks: "ansible-tasks/collect-proxmox-vm.yml"

  - name: Include Proxmox LXC discovery
    include_tasks: "ansible-tasks/collect-proxmox-lxc.yml"

  # ---------------------------------------------------------------------------
  # Die Werte kommen als gerenderte Webhook-Strings an. Ein leeres NetBox-Feld
  # wird dabei zum Text "None", nicht zu einem leeren Wert - ungeprueft landete
  # dieser Text bisher als SSH-Key in der VM.
  # ---------------------------------------------------------------------------
  - name: "Normalise the values coming from the webhook"
    ansible.builtin.set_fact:
      vm_ip_cidr: "{{ '' if ((vm_config['ip'] | default('') | string) in ['', 'None', 'none', 'null']) else (vm_config['ip'] | string) }}"
      vm_ssh_key: "{{ '' if ((vm_config['ssh_key'] | default('') | string) in ['', 'None', 'none', 'null']) else (vm_config['ssh_key'] | string) }}"

  # ---------------------------------------------------------------------------
  # 0) VM-Datensatz holen - liefert die DNS-Server und weiter unten die id fuer
  #    das Fortschreiben von proxmox_status.
  # ---------------------------------------------------------------------------
  - name: "Look up the VM in NetBox"
    ansible.builtin.uri:
      url: "{{ nb_api_base }}/api/virtualization/virtual-machines/?name={{ vm_config['name'] | urlencode }}"
      headers: "{{ nb_auth_headers }}"
      validate_certs: false
    register: nb_vm

  # ---------------------------------------------------------------------------
  # DNS-Server aus dem Custom Field proxmox_dns_servers.
  #
  # Ist das Feld leer, wird nameservers NICHT uebergeben und Proxmox verhaelt
  # sich wie ohne diese Automatisierung.
  #
  # ACHTUNG, was "Standardverhalten" konkret bedeutet (Cloudinit.pm,
  # get_dns_conf): Ohne gesetzten nameserver nimmt Proxmox die /etc/resolv.conf
  # des HYPERVISORS. Auf STR1-0005-AH01 steht dort "nameserver 127.0.0.53" -
  # der systemd-resolved-Stub. Eine VM mit STATISCHER IP bekommt dann diese
  # Loopback-Adresse als DNS-Server eingetragen und loest nichts auf. Bei
  # ip=dhcp ist es unkritisch, dort liefert der DHCP-Server das DNS und
  # Proxmox schreibt gar keine DNS-Zeile.
  #
  # Getrennt wird an Leerzeichen, Komma oder Semikolon - je nachdem, wie es
  # jemand eintraegt.
  # ---------------------------------------------------------------------------
  - name: "Determine the DNS servers from NetBox"
    vars:
      dns_raw: "{{ (((nb_vm.json.results | default([]) | first | default({})).custom_fields | default({})).proxmox_dns_servers | default('') | string) }}"
    ansible.builtin.set_fact:
      vm_dns_servers: "{{ [] if (dns_raw | trim | length) == 0 or (dns_raw | trim) in ['None', 'none', 'null'] else (dns_raw | regex_replace('[,;]', ' ')).split() }}"

  # ---------------------------------------------------------------------------
  # 1) VLAN bestimmen
  #
  # Primaerquelle ist das VLAN am NetBox-Interface der VM - egal ob als
  # untagged (mode=access) oder als erstes tagged VLAN hinterlegt. Beide
  # Schreibweisen kommen im Bestand vor.
  # ---------------------------------------------------------------------------
  - name: "Look up the VM interface in NetBox"
    ansible.builtin.uri:
      url: "{{ nb_api_base }}/api/virtualization/interfaces/?virtual_machine={{ vm_config['name'] | urlencode }}"
      headers: "{{ nb_auth_headers }}"
      validate_certs: false
    register: nb_vm_interfaces

  - name: "Determine the VLAN from the NetBox interface"
    vars:
      iface: "{{ (nb_vm_interfaces.json.results | default([]) | first) | default({}) }}"
    ansible.builtin.set_fact:
      interface_vlan_vid: >-
        {{ ((iface.untagged_vlan | default(None)).vid
            if ((iface.untagged_vlan | default(None)) is mapping)
            else ((iface.tagged_vlans | default([]) | first).vid
                  if ((iface.tagged_vlans | default([]) | length) > 0)
                  else 0)) | int }}
    when: (nb_vm_interfaces.json.count | default(0) | int) > 0

  # ---------------------------------------------------------------------------
  # 1b) Rueckfall auf die IP am Interface.
  #
  # Der Webhook liefert data['primary_ip4']['address'] - das ist ein EIGENES
  # Feld an der VM und wird NICHT gesetzt, nur weil man einem Interface eine
  # IP zuweist. Genau daran ist es am 31.07.2026 gescheitert: tsplus01 hatte
  # 10.251.0.30/24 am Interface Ethernet haengen, primary_ip4 war leer, und der
  # Job konfigurierte daraufhin DHCP.
  #
  # Die IP am Interface ist die Stelle, an der man sie fachlich erwartet.
  # Deshalb wird sie hier herangezogen, wenn primary_ip4 leer ist. Ist
  # primary_ip4 gesetzt, hat es Vorrang - das ist die ausdrueckliche Ansage,
  # welche der moeglicherweise mehreren Adressen gelten soll.
  # ---------------------------------------------------------------------------
  - name: "Look up IPv4 addresses assigned to the VM interface"
    ansible.builtin.uri:
      url: "{{ nb_api_base }}/api/ipam/ip-addresses/?vminterface_id={{ (nb_vm_interfaces.json.results | first).id }}&family=4"
      headers: "{{ nb_auth_headers }}"
      validate_certs: false
    register: nb_iface_ips
    when:
      - (nb_vm_interfaces.json.count | default(0) | int) > 0
      - (vm_ip_cidr | length) == 0

  - name: "Fall back to the interface IP when the VM has no primary IPv4"
    ansible.builtin.set_fact:
      vm_ip_cidr: "{{ (nb_iface_ips.json.results | default([]) | map(attribute='address') | list | first) | default('') }}"
      vm_ip_source: "Interface (primary_ip4 der VM ist leer)"
    when:
      - nb_iface_ips is defined
      - nb_iface_ips.json is defined
      - (nb_iface_ips.json.count | default(0) | int) > 0

  # ---------------------------------------------------------------------------
  # 2) Prefix der IP suchen - liefert das Gateway und, falls am Interface kein
  #    VLAN gesetzt ist, einen Rueckfall fuer das VLAN. Prefixe tragen in
  #    NetBox eine VLAN-Zuordnung (z.B. 10.251.0.0/24 -> VLAN 50).
  # ---------------------------------------------------------------------------
  - name: "Look up the prefix containing the VM IP"
    ansible.builtin.uri:
      url: "{{ nb_api_base }}/api/ipam/prefixes/?contains={{ (vm_ip_cidr | regex_replace('/.*$', '')) | urlencode }}"
      headers: "{{ nb_auth_headers }}"
      validate_certs: false
    register: nb_prefixes
    when: vm_ip_cidr | length > 0

  - name: "Pick the most specific prefix"
    ansible.builtin.set_fact:
      # _depth steigt mit der Verschachtelungstiefe - der letzte Eintrag ist
      # damit das spezifischste Prefix.
      vm_prefix_obj: "{{ (nb_prefixes.json.results | sort(attribute='_depth') | last) }}"
    when:
      - nb_prefixes is defined
      - (nb_prefixes.json.count | default(0) | int) > 0

  - name: "Determine the effective VLAN"
    ansible.builtin.set_fact:
      # vm_prefix_obj existiert nur, wenn eine IP gesetzt ist - daher der
      # default({}), sonst haengt der Rueckfall an einer undefinierten Variable.
      effective_vlan_vid: >-
        {{ (interface_vlan_vid | default(0) | int)
           if ((interface_vlan_vid | default(0) | int) > 0)
           else ((vm_prefix_obj | default({})).vlan.vid | default(0) | int) }}

  # ---------------------------------------------------------------------------
  # 3) VNet zum VLAN-Tag ermitteln.
  #
  # Bewusst per Nachschlagen statt "vnet" ~ vlan_id: Die Namensgebung ist eine
  # Konvention, kein Zwang. Massgeblich ist das Tag der SDN-VNets - so bleibt
  # es richtig, falls ein VNet einmal anders heisst.
  # ---------------------------------------------------------------------------
  - name: "Look up the Proxmox SDN vnets"
    ansible.builtin.uri:
      url: "{{ pve_api_base }}/cluster/sdn/vnets"
      headers: "{{ pve_auth_headers }}"
      validate_certs: false
    register: pve_sdn_vnets
    no_log: true
    when: (effective_vlan_vid | default(0) | int) > 0

  - name: "Determine the vnet carrying that VLAN tag"
    ansible.builtin.set_fact:
      vm_vnet: >-
        {{ (pve_sdn_vnets.json.data | default([])
            | selectattr('tag', 'defined')
            | selectattr('tag', 'equalto', effective_vlan_vid | int)
            | map(attribute='vnet') | list | first) | default('') }}
    when:
      - pve_sdn_vnets is defined
      - pve_sdn_vnets.json is defined

  - name: "Fail if the VLAN has no matching vnet"
    ansible.builtin.fail:
      msg: >-
        Fuer VLAN {{ effective_vlan_vid }} gibt es auf {{ vm_config['node'] }}
        kein SDN-VNet. Vorhanden sind:
        {{ pve_sdn_vnets.json.data | default([]) | map(attribute='vnet') | join(', ') }}.
        Entweder das VLAN am Interface in NetBox korrigieren oder das VNet in
        Proxmox anlegen.
    when:
      - (effective_vlan_vid | default(0) | int) > 0
      - (vm_vnet | default('')) | length == 0

  # ---------------------------------------------------------------------------
  # 4) net0 neu bauen.
  #
  # NICHT einfach "virtio,bridge=X" setzen: Damit wuerde Proxmox eine neue MAC
  # vergeben, und Windows saehe eine fremde Netzwerkkarte - inklusive neuem
  # Netzwerkprofil und verlorener Adapterkonfiguration. Deshalb wird die
  # bestehende Zeile gelesen und ausschliesslich die Bridge ersetzt; Modell,
  # MAC und Flags wie firewall=1 bleiben unangetastet.
  # ---------------------------------------------------------------------------
  - name: "Read the current VM config from Proxmox"
    ansible.builtin.uri:
      url: "{{ pve_api_base }}/nodes/{{ vm_config['node'] }}/qemu/{{ collected_proxmox_vm[vm_config['name']] }}/config"
      headers: "{{ pve_auth_headers }}"
      validate_certs: false
    register: pve_vm_cfg
    no_log: true
    when:
      - vm_config['name'] in collected_proxmox_vm
      - (vm_vnet | default('')) | length > 0

  - name: "Rebuild net0 with the new bridge, keeping model, MAC and flags"
    ansible.builtin.set_fact:
      vm_net0: "{{ pve_vm_cfg.json.data.net0 | regex_replace('bridge=[^,]+', 'bridge=' ~ vm_vnet) }}"
    when:
      - pve_vm_cfg is defined
      - pve_vm_cfg.json is defined
      - (pve_vm_cfg.json.data.net0 | default('')) | length > 0

  # ---------------------------------------------------------------------------
  # 5) Gateway aus dem Prefix holen.
  #
  # Konvention: Die Gateway-Adresse traegt "default_gateway" in ihrer
  # Beschreibung. Findet sich keine, wird ipconfig0 ohne gw= gesetzt - die VM
  # ist dann im eigenen Subnetz erreichbar, aber nicht darueber hinaus.
  # ---------------------------------------------------------------------------
  - name: "Look up the default gateway inside that prefix"
    ansible.builtin.uri:
      url: "{{ nb_api_base }}/api/ipam/ip-addresses/?parent={{ vm_prefix_obj.prefix | urlencode }}&description__ic=default_gateway"
      headers: "{{ nb_auth_headers }}"
      validate_certs: false
    register: nb_gateway
    when: vm_prefix_obj is defined

  - name: "Determine the gateway address"
    ansible.builtin.set_fact:
      vm_gateway: >-
        {{ ((nb_gateway.json.results | default([]) | map(attribute='address') | list | first) | default(''))
           | regex_replace('/.*$', '') }}
    when:
      - nb_gateway is defined
      - nb_gateway.json is defined

  # ---------------------------------------------------------------------------
  # 6) ipconfig0 zusammensetzen.
  #      keine IP        -> DHCP
  #      IP ohne Gateway -> nur ip=
  #      IP mit Gateway  -> ip= und gw=
  # ---------------------------------------------------------------------------
  - name: "Assemble ipconfig0"
    ansible.builtin.set_fact:
      vm_ipconfig0: >-
        {{ 'ip=dhcp' if ((vm_ip_cidr | length) == 0)
           else ('ip=' ~ vm_ip_cidr ~ ',gw=' ~ vm_gateway
                 if ((vm_gateway | default('') | length) > 0)
                 else 'ip=' ~ vm_ip_cidr) }}

  - name: "Show what will be applied"
    ansible.builtin.debug:
      msg:
        - "VLAN      : {{ effective_vlan_vid | default(0) }} (Interface: {{ interface_vlan_vid | default(0) }}, Prefix: {{ (vm_prefix_obj | default({})).vlan.vid | default('-') }})"
        - "IP-Quelle : {{ vm_ip_source | default('primary_ip4 der VM') }}"
        - "VNet      : {{ vm_vnet | default('(unveraendert)') }}"
        - "net0      : {{ vm_net0 | default('(unveraendert)') }}"
        - "Prefix    : {{ (vm_prefix_obj | default({})).prefix | default('-') }}"
        - "Gateway   : {{ vm_gateway | default('(keines gefunden)') }}"
        - "DNS       : {{ (vm_dns_servers | default([]) | join(', ')) if ((vm_dns_servers | default([]) | length) > 0) else '(nicht gesetzt - Proxmox-Standard, siehe Kommentar im Playbook)' }}"
        - "ipconfig0 : {{ vm_ipconfig0 }}"

  - name: "Update VM settings (network, ipconfig0, ssh key)"
    community.proxmox.proxmox_kvm:
      validate_certs: "{{ proxmox_env_info.validate_certs | default(false) }}"
      node: "{{ vm_config['node'] }}"
      api_user: "{{ proxmox_env_info.api_user }}"
      api_token_id: "{{ proxmox_env_info.api_token_id }}"
      api_token_secret: "{{ proxmox_env_info.api_token_secret }}"
      api_host: "{{ proxmox_env_info.api_host }}"
      vmid: "{{ collected_proxmox_vm[vm_config['name']] }}"
      sshkeys: "{{ vm_ssh_key if ((vm_ssh_key | length) > 0) else omit }}"
      net: "{{ {'net0': vm_net0} if ((vm_net0 | default('') | length) > 0) else omit }}"
      # Leer -> Parameter entfaellt -> Proxmox-Standardverhalten.
      nameservers: "{{ vm_dns_servers if ((vm_dns_servers | default([]) | length) > 0) else omit }}"
      ipconfig:
        ipconfig0: "{{ vm_ipconfig0 }}"
      update: true
      # ZWINGEND, sonst wird net LAUTLOS verworfen.
      #
      # proxmox_kvm ueberspringt bei update=true die Parameter net, virtio,
      # virtiofs, ide, sata und scsi, solange update_unsafe nicht gesetzt ist
      # (proxmox_kvm.py: "If update, don't update disk ... and network
      # interface, unless update_unsafe=True"). Der Task meldet trotzdem
      # changed, weil ipconfig0 durchgeht - am 31.07.2026 genau so beobachtet:
      # ipconfig0 stand danach auf ip=dhcp, net0 unveraendert auf vnet50.
      #
      # Die Begruendung des Moduls fuer die Sperre ist, dass ein Update von net
      # die MAC-Adresse neu vergibt. Genau das kann hier nicht passieren: Der
      # Task oben liest die bestehende net0-Zeile und ersetzt ausschliesslich
      # die Bridge - Modell, MAC und Flags werden unveraendert mitgeschrieben.
      #
      # Disk-Parameter sind von der Lockerung nicht betroffen, weil dieser Task
      # keine uebergibt.
      update_unsafe: true
    when: vm_config['name'] in collected_proxmox_vm
    register: update_vm_settings_job
    async: 180
    poll: 0

  - name: Wait for VM settings updates processes to finish
    async_status:
      jid: "{{ update_vm_settings_job.ansible_job_id }}"
    when: vm_config['name'] in collected_proxmox_vm
    register: _ujobs_alias_vc_0
    until: _ujobs_alias_vc_0.finished
    retries: 60
    delay: 10

  # ---------------------------------------------------------------------------
  # Cloud-Init-Laufwerk neu erzeugen.
  #
  # ZWINGEND, sonst wirkt das oben gesetzte ipconfig0 bei einer bereits
  # laufenden VM NICHT. Proxmox schreibt geaenderte Cloud-Init-Werte nur in die
  # VM-Konfiguration; auf das Laufwerk gelangen sie erst beim naechsten
  # Stop/Start oder durch diesen Aufruf. Bis dahin fuehrt "qm cloudinit pending"
  # sie als "new" und der Gast liest weiter die alten Daten.
  #
  # Bei einer frisch geklonten VM faellt das nicht auf, weil sie ohnehin erst
  # danach zum ersten Mal startet. Am 08.08.2026 an MGMTADC03 beobachtet:
  # ipconfig0 in der Config gesetzt, Gast auf APIPA (169.254.x), und
  # cloudbase-init meldete "NetworkConfigPlugin execution already done,
  # skipping" - weil die Instanz-ID unveraendert blieb.
  #
  # Proxmox leitet die Instanz-ID aus dem INHALT der Cloud-Init-Daten ab
  # (Cloudinit.pm: cloudbase_gen_instance_id). Nach dem Neuerzeugen ist sie
  # anders, und cloudbase-init fuehrt beim naechsten Start alle Plugins erneut
  # aus - das Netzwerk wird also tatsaechlich angewendet.
  #
  # NICHT enthalten: ein Neustart. cloudbase-init liest das Laufwerk nur beim
  # Hochfahren, die neue Konfiguration greift also erst dann. Einen laufenden
  # Server ungefragt neu zu starten waere hier aber der falsche Automatismus -
  # das gehoert in die Hand dessen, der die Aenderung veranlasst.
  # ---------------------------------------------------------------------------
  - name: "Regenerate the cloud-init drive so the guest actually sees the change"
    ansible.builtin.uri:
      url: "{{ pve_api_base }}/nodes/{{ vm_config['node'] }}/qemu/{{ collected_proxmox_vm[vm_config['name']] }}/cloudinit"
      method: PUT
      headers: "{{ pve_auth_headers }}"
      status_code: [200, 204]
      validate_certs: false
    no_log: true
    when: vm_config['name'] in collected_proxmox_vm

  - name: "Note that a restart is required for the new network settings"
    ansible.builtin.debug:
      msg: >-
        Cloud-Init-Laufwerk neu erzeugt. cloudbase-init liest es erst beim
        naechsten Start der VM - bis dahin behaelt '{{ vm_config['name'] }}'
        die bisherige Netzwerkkonfiguration.
    when: vm_config['name'] in collected_proxmox_vm

  # ---------------------------------------------------------------------------
  # Zustand in NetBox fortschreiben - Custom Field proxmox_status.
  #
  # Gleiches Muster wie MaaS_Status bei den Devices. "configure network" ist der
  # Wert, der diesen Job ausloest; hier wird er auf den Endzustand gesetzt.
  # Damit ist zugleich der Ausloeser wieder entschaerft - das Feld steht nicht
  # dauerhaft auf "configure network", und ein spaeteres Speichern der VM
  # startet den Job nicht erneut.
  #
  # Bewusst als letzter Schritt, nach dem Warten auf den Proxmox-Job: Steht der
  # Wert, ist die Konfiguration wirklich angekommen.
  # ---------------------------------------------------------------------------
  # Der VM-Datensatz wurde ganz oben schon geholt (nb_vm) - keine zweite Abfrage.
  - name: "Mark the network as configured in NetBox"
    ansible.builtin.uri:
      url: "{{ nb_api_base }}/api/virtualization/virtual-machines/{{ (nb_vm.json.results | first).id }}/"
      method: PATCH
      body_format: json
      body:
        custom_fields:
          proxmox_status: "Clone created - network configured"
      headers: "{{ nb_auth_headers }}"
      status_code: 200
      validate_certs: false
    when:
      - vm_config['name'] in collected_proxmox_vm
      - nb_vm is defined
      - nb_vm.json is defined
      - (nb_vm.json.count | default(0) | int) > 0
